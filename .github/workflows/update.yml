name: Update articles

on:
  schedule:
    # hourly (UTC); minute 17 avoids the top-of-hour rush. GitHub delays or skips scheduled runs when it is busy
    # (a 3-hourly schedule was actually running every 4-8 hours), so asking hourly keeps the real gap short.
    - cron: "17 * * * *"
  workflow_dispatch:

# a slow run must never overlap the next one
concurrency:
  group: update-articles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # a second try covers a rare dropped connection; the job is safe to repeat (done articles are skipped)
      - name: Collect, translate and summarize
        run: npm run update || npm run update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # one write-up per finished week; a no-op on the other days, and a failure here must not fail the update
      - name: Weekly briefing
        continue-on-error: true
        run: npm run briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
